name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tool versions live in scripts/tool-versions.env so this workflow and
# scripts/check.sh cannot drift apart. Each job loads them into $GITHUB_ENV
# before the steps that need them. uv supplies every Python tool and
# interpreter, so no setup-python step is needed.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Ruff lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

      - name: Ruff format
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check --diff .

      - name: Yamllint
        run: uvx yamllint@${{ env.YAMLLINT_VERSION }} --strict .

      - name: Shellcheck
        run: >
          uvx --from shellcheck-py==${{ env.SHELLCHECK_VERSION }}
          shellcheck sync-installable-skills.sh scripts/check.sh

  prose:
    name: Docs and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@${{ env.MARKDOWNLINT_VERSION }}

      # Two complementary spell checks: codespell has a curated
      # misspelling->correction list (high precision, no dictionary to
      # maintain), cspell checks every word against a dictionary and catches
      # what codespell's list does not know about.
      - name: Spell check (codespell)
        run: >
          uvx --from "codespell[toml]==${{ env.CODESPELL_VERSION }}"
          codespell

      - name: Spell check (cspell)
        run: >
          npx --yes cspell@${{ env.CSPELL_VERSION }}
          --no-progress --show-suggestions "**"

  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Validate skill structure
        run: >
          uv run --no-project --with PyYAML==${{ env.PYYAML_VERSION }}
          python scripts/validate_skills.py

      - name: Sync script dry run
        run: ./sync-installable-skills.sh --dry-run

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # uv downloads the interpreter itself, so the matrix needs no
      # separate Python setup step.
      - name: Run tests
        run: >
          uv run --no-project --python ${{ matrix.python-version }}
          --with pytest==${{ env.PYTEST_VERSION }}
          pytest -v
