[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.codespell]
skip = "./.git,./node_modules,./assets,./LICENSE,*.lock"
# codespell only flags words it knows are misspellings, so this list stays
# small — add a term here only when it is a real word being false-flagged.
ignore-words-list = "assertIn"
